<style>

.row{display:flex;gap:10px;flex-wrap:wrap}

button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--minus);outline-offset:2px}
.score{font:800 56px/1 var(--display);font-variant-numeric:tabular-nums;margin:0}

sup{font-size:.7em}

const TESTS=[
{name:'Test 1',title:'To trzeba umieć',qs:[
 {n:1,type:'single',note:'<b>Uwaga.</b> W zadaniach 1 i 2 wybierz poprawne dokończenia zdań.',stem:'Ciało jest naelektryzowane',
  opts:[['A','wtedy, gdy ma tyle samo ładunków dodatnich co ujemnych.'],['B','tylko wtedy, gdy ma nadmiar ładunków ujemnych.'],['C','tylko wtedy, gdy ma nadmiar ładunków dodatnich.'],['D','zarówno wtedy, gdy posiada nadmiar ładunków dodatnich, jak i wtedy, gdy ma nadmiar ładunków ujemnych.']],
  ans:'D',ex:'Ciało jest naelektryzowane, gdy ma <b>przewagę ładunków jednego znaku, obojętnie którego</b>. Nadmiar elektronów oznacza ładunek ujemny, a niedobór elektronów ładunek dodatni. Odpowiedź A opisuje ciało obojętne. B i C są złe przez słowo „tylko”.'},
 {n:2,type:'single',stem:'Początkowo obojętną elektrycznie szklaną rurkę naelektryzowano dodatnio. W wyniku naelektryzowania rurka',
  opts:[['A','straciła część protonów.'],['B','straciła część elektronów.'],['C','zyskała dodatkowe protony.'],['D','zyskała dodatkowe elektrony.']],

 {n:3,type:'multi',stem:'Ciała I, II oraz III są naelektryzowane i oddziałują ze sobą tak, jak przedstawiono na poniższym rysunku. <b>Wskaż zdania prawdziwe.</b>',fig:FIG_ARROWS,
  opts:[['A','Ciała I i II mają ładunki o tym samym znaku.','Fałsz. Strzałki I i II są skierowane do siebie, więc ciała się przyciągają. Przyciągają się ładunki różnoimienne.'],
        ['B','Ciała I i III mają ładunki jednoimienne.','Prawda. Strzałki I i III są skierowane od siebie, więc ciała się odpychają. Odpychają się ładunki jednoimienne.'],
        ['C','Ciała II i III będą się wzajemnie przyciągać.','Prawda. II ma znak przeciwny niż I, a III ten sam co I. Zatem II i III mają przeciwne znaki i się przyciągają.']],
  ans:['B','C'],ex:'Strzałki do siebie oznaczają przyciąganie, czyli różne znaki. Strzałki od siebie oznaczają odpychanie, czyli ten sam znak.'},
 {n:4,type:'gaps',note:'<b>Uwaga.</b> W zadaniach 4 i 5 wskaż poprawne uzupełnienia zdań.',
  stem:'Szklaną rurkę potarto jedwabną tkaniną. Następnie rurką dotknięto rozładowanego elektroskopu. Wiadomo, że jedwabna tkanina naelektryzowała się ujemnie.',
  text:'Szklana rurka w wyniku pocierania jedwabiem [[0]]. Gdy rurkę zetknięto z elektroskopem, elektroskop [[1]].',
  gaps:[{o:[['A','naelektryzowała się ujemnie'],['B','naelektryzowała się dodatnio'],['C','pozostała elektrycznie obojętna']],a:'B'},

 {n:5,type:'gaps',stem:'Ujemnie naelektryzowaną rurkę z tworzywa sztucznego zetknięto z nienaelektryzowanym elektroskopem. Następnie elektroskopu dotknięto palcem.',

 {n:6,type:'single',stem:'W pracowni szkolnej zgromadzono różne przedmioty, aby przeprowadzić doświadczenie. Wskaż zbiór, który zawiera <b>wyłącznie izolatory</b>.',

const tabsEl=document.getElementById('tabs'),strip=document.getElementById('strip'),app=document.getElementById('app');
let cur={t:0,i:0};const res=TESTS.map(T=>T.qs.map(()=>null));let st={};
function tabs(){tabsEl.innerHTML=TESTS.map((T,k)=>`<button role="tab" id="tab${k}" aria-selected="${k===cur.t}" data-t="${k}">${T.name}<small>${T.title}</small></button>`).join('');
 tabsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur={t:+b.dataset.t,i:0};show()})}
function stripR(){const T=TESTS[cur.t];strip.innerHTML=`<h2>${T.name}. ${T.title}</h2>`+T.qs.map((q,k)=>{const r=res[cur.t][k];return `<button class="num ${k===cur.i?'cur':''} ${r===true?'ok':r===false?'bad':''}" data-i="${k}" aria-label="Zadanie ${q.n}">${q.n}</button>`}).join('');
 strip.querySelectorAll('.num').forEach(b=>b.onclick=()=>{cur.i=+b.dataset.i;show()})}
function show(){tabs();stripR();const T=TESTS[cur.t];if(cur.i>=T.qs.length)return end();const q=T.qs[cur.i];st={sel:new Set(),done:false};
 let body='';
 if(q.type==='single'||q.type==='multi')body=`<div class="opts">${q.opts.map(o=>`<button class="opt ${q.type==='multi'?'multi':''}" data-k="${o[0]}"><b class="k">${o[0]}</b><span>${o[1]}<span class="why" hidden>${o[2]||''}</span></span></button>`).join('')}</div>${q.type==='multi'?'<div class="note">Zaznacz wszystkie pasujące odpowiedzi.</div>':''}`;
 if(q.type==='gaps')body=`<div class="gaptext">${q.text.replace(/\[\[(\d)\]\]/g,(m,g)=>`<select id="g${cur.t}-${cur.i}-${g}" data-g="${g}"><option value="">— wybierz —</option>${q.gaps[g].o.map(o=>`<option value="${o[0]}">${o[0]}. ${o[1]}</option>`).join('')}</select><span class="fix" data-f="${g}"></span>`)}</div>`;
 if(q.type==='match')body=`<div>${q.items.map((it,r)=>`<div class="mrow" data-r="${r}"><div class="t"><b>${it[0]}.</b><span>${it[1]}</span></div><div class="chips">${q.cols.map(c=>`<button class="chip" data-r="${r}" data-c="${c[0]}">${c[1]}</button>`).join('')}</div><div class="why" hidden>${it[3]}</div></div>`).join('')}</div>`;
 if(q.type==='num')body=`<div class="fields">${q.fields.map((f,k)=>`<div class="field"><label for="f${cur.t}-${cur.i}-${k}">${f.label}</label>${f.sel?`<select id="f${cur.t}-${cur.i}-${k}"><option value="">— wybierz —</option>${f.sel.map(s=>`<option>${s}</option>`).join('')}</select>`:`<input id="f${cur.t}-${cur.i}-${k}" inputmode="decimal" autocomplete="off"> <span>${f.unit}</span>`}</div>`).join('')}</div>`;
 app.innerHTML=`<section class="card">${q.info||''}${q.note&&q.type!=='num'?`<div class="note">${q.note}</div>`:''}
  <div class="qn"><span class="badge">${String(q.n).replace(/[abc]/,'')}</span><div class="stem">${q.stem}</div></div>
  ${q.fig?`<div class="fig">${q.fig}</div>`:''}${q.note&&q.type==='num'?`<div class="note">${q.note}</div>`:''}
  ${body}<div id="fb"></div>
  <div class="row" id="acts"><button class="btn" id="chk">Sprawdź</button></div></section>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(st.done)return;const k=b.dataset.k;
  if(q.type==='single'){st.sel.clear();app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'))}
  if(st.sel.has(k)){st.sel.delete(k);b.classList.remove('sel')}else{st.sel.add(k);b.classList.add('sel')}});
 app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(st.done)return;b.classList.toggle('sel')});
 document.getElementById('chk').onclick=()=>check(q);
}
const num=s=>parseFloat(String(s).replace(',','.').replace(/\s/g,''));
function check(q){st.done=true;let ok=true,corr='';
 if(q.type==='single'||q.type==='multi'){const ans=[].concat(q.ans);
  app.querySelectorAll('.opt').forEach(b=>{const k=b.dataset.k,s=st.sel.has(k),a=ans.includes(k);b.disabled=true;b.classList.remove('sel');
   if(a&&s)b.classList.add('ok');else if(a){b.classList.add('miss');ok=false}else if(s){b.classList.add('bad');ok=false}
   if(q.type==='multi')b.querySelector('.why').hidden=false});
  if(st.sel.size===0)ok=false;corr=ans.join(' i ');}
 if(q.type==='gaps'){q.gaps.forEach((g,k)=>{const s=app.querySelector(`select[data-g="${k}"]`);s.disabled=true;
   if(s.value===g.a)s.classList.add('ok');else{ok=false;s.classList.add('bad');app.querySelector(`[data-f="${k}"]`).textContent=` → ${g.a}`}});
  corr=q.gaps.map(g=>g.a).join(', ');}
 if(q.type==='match'){q.items.forEach((it,r)=>{let rowOk=true;app.querySelectorAll(`.chip[data-r="${r}"]`).forEach(c=>{const s=c.classList.contains('sel'),a=it[2].includes(c.dataset.c);c.disabled=true;c.classList.remove('sel');
    if(a&&s)c.classList.add('ok');else if(a){c.classList.add('miss');rowOk=false}else if(s){c.classList.add('bad');rowOk=false}});
   if(!rowOk){ok=false;app.querySelector(`.mrow[data-r="${r}"] .why`).hidden=false}});corr='';}
 if(q.type==='num'){q.fields.forEach((f,k)=>{const el=document.getElementById(`f${cur.t}-${cur.i}-${k}`);el.disabled=true;let good;
   if(f.sel)good=el.value===f.a;else{const v=num(el.value);good=!isNaN(v)&&v>=f.min&&v<=f.max}
   el.classList.add(good?'ok':'bad');if(!good)ok=false});corr=q.corr;}
 res[cur.t][cur.i]=ok;stripR();
 const last=cur.i===TESTS[cur.t].qs.length-1;
 document.getElementById('fb').innerHTML=`<div class="expl ${ok?'':'no'}"><strong>${ok?'Dobrze!':'Niestety źle.'}</strong>${!ok&&corr?`<span class="corr">Prawidłowa odpowiedź: ${corr}</span>`:''}${!ok&&q.type==='match'?'<span class="corr">Pod błędnymi informacjami jest wyjaśnienie. Linią przerywaną zaznaczono kolumny, których zabrakło.</span>':''}<b>Dlaczego?</b> ${q.ex}</div>`;
 document.getElementById('acts').innerHTML=`<button class="btn ghost" id="again">Spróbuj jeszcze raz</button><button class="btn" id="next">${last?'Zobacz wynik':'Następne zadanie'}</button>`;
 document.getElementById('again').onclick=()=>{res[cur.t][cur.i]=null;show()};
 document.getElementById('next').onclick=()=>{cur.i++;show();window.scrollTo({top:0})};
 document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function end(){const T=TESTS[cur.t],r=res[cur.t],good=r.filter(x=>x===true).length,n=T.qs.length;
 const bad=T.qs.map((q,k)=>[q,k]).filter(([q,k])=>r[k]!==true);
 app.innerHTML=`<section class="card"><p class="score">${good}<small> / ${n}</small></p>
  <p class="verdict">${good===n?'Komplet! Ten test masz opanowany.':good>=n*0.7?'Dobrze. Popraw jeszcze zadania poniżej.':'Wróć do zadań poniżej i przeczytaj wyjaśnienia.'}</p>
  ${bad.length?`<div class="strip">${bad.map(([q,k])=>`<button class="num bad" data-i="${k}">${q.n}</button>`).join('')}</div><p class="sub">Dotknij numeru, żeby wrócić do zadania.</p>`:''}
  <div class="row"><button class="btn ghost" id="rst">Ten test od nowa</button>${cur.t<TESTS.length-1?`<button class="btn" id="nxt">${TESTS[cur.t+1].name} →</button>`:''}</div></section>`;
 app.querySelectorAll('.num').forEach(b=>b.onclick=()=>{cur.i=+b.dataset.i;show()});
 document.getElementById('rst').onclick=()=>{res[cur.t]=T.qs.map(()=>null);cur.i=0;show()};
 const nx=document.getElementById('nxt');if(nx)nx.onclick=()=>{cur={t:cur.t+1,i:0};show()};
}
show();
</script>
</body></html>

const app=document.getElementById('app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s;
let S={pool:[],i:0,score:0,wrong:[],answered:false,opts:[]};
function startQuiz(list){S={pool:shuffle(list||Q),i:0,score:0,wrong:[],answered:false};renderQ()}
function renderQ(){
  const it=S.pool[S.i];S.answered=false;
  S.opts=shuffle(it.a.map((t,k)=>({t,ok:k===0})));
  const n=S.pool.length;
  app.innerHTML=`<section class="card">
   <div class="meta"><span>Pytanie ${S.i+1} z ${n}</span><span>Punkty: ${S.score}</span></div>
   <div class="bar"><i style="width:${S.i/n*100}%"></i></div>
   <div class="tag">${it.t}</div>
   <h2 class="q">${it.q}</h2>
   <div class="opts">${S.opts.map((o,k)=>`<button class="opt" id="o${k}" data-k="${k}"><b>${'ABCD'[k]}</b><span>${o.t}</span></button>`).join('')}</div>
   <div id="fb"></div></section>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
}
function pick(k){
  if(S.answered)return;S.answered=true;
  const it=S.pool[S.i],good=S.opts[k].ok;
  app.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(S.opts[j].ok)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
  if(good)S.score++;else S.wrong.push(it);
  const last=S.i===S.pool.length-1;
  document.getElementById('fb').innerHTML=`<div class="expl ${good?'':'no'}"><strong>${good?'Dobrze!':'Źle. Poprawna odpowiedź jest na zielono.'}</strong>${it.e}</div>
   <div class="row" style="margin-top:12px"><button class="btn" id="next">${last?'Zobacz wynik':'Dalej'}</button></div>`;
  const nb=document.getElementById('next');nb.focus({preventScroll:true});
  nb.onclick=()=>{if(last)renderEnd();else{S.i++;renderQ();window.scrollTo({top:0})}};
}
function grade(p){if(p>=.91)return'Celujący poziom. Jesteś gotowy!';if(p>=.75)return'Bardzo dobrze. Powtórz błędne i będzie komplet.';if(p>=.5)return'Nieźle, ale jeszcze trochę nauki. Przejrzyj fiszki.';return'Trzeba jeszcze popracować. Zacznij od fiszek, potem wróć do quizu.'}
function renderEnd(){
  const n=S.pool.length,p=S.score/n;let best=0;
  try{best=+localStorage.getItem('best')||0;if(p>best){localStorage.setItem('best',p);}}catch(e){}
  app.innerHTML=`<section class="card">
   <div class="bar"><i style="width:100%"></i></div>
   <p class="score">${S.score}<small> / ${n}</small></p>
   <p class="verdict">${grade(p)}</p>
   ${best&&n===Q.length?`<p class="sub">Twój najlepszy wynik: ${Math.round(Math.max(best,p)*100)}%</p>`:''}
   ${S.wrong.length?`<div><div class="tag" style="margin-bottom:8px">Do powtórki</div><ol class="wrong">${S.wrong.map(w=>`<li>${w.q}<br><span>${w.a[0]}</span></li>`).join('')}</ol></div>`:''}
   <div class="row">${S.wrong.length?`<button class="btn" id="rw">Powtórz błędne (${S.wrong.length})</button>`:''}<button class="btn ghost" id="ra">Cały quiz od nowa</button></div></section>`;
  const w=S.wrong.slice();
  if(w.length)document.getElementById('rw').onclick=()=>startQuiz(w);
  document.getElementById('ra').onclick=()=>startQuiz();
  window.scrollTo({top:0});
}
let FC={deck:[],i:0,know:0};
function startFlash(deck){FC={deck:shuffle(deck||F),i:0,know:0,again:[]};renderF()}
function renderF(){
  if(FC.i>=FC.deck.length){
    app.innerHTML=`<section class="card"><p class="verdict">Przejrzane! Umiesz ${FC.know} z ${FC.deck.length}.</p>
     <div class="row">${FC.again.length?`<button class="btn" id="fa">Jeszcze raz te ${FC.again.length}</button>`:''}<button class="btn ghost" id="fr">Wszystkie od nowa</button></div>
     <p class="sub">Teraz sprawdź się w zakładce Quiz.</p></section>`;
    const a=FC.again.slice();if(a.length)document.getElementById('fa').onclick=()=>startFlash(a);
    document.getElementById('fr').onclick=()=>startFlash();return;
  }
  const [t,d]=FC.deck[FC.i];
  app.innerHTML=`<section class="card">
   <div class="meta"><span>Fiszka ${FC.i+1} z ${FC.deck.length}</span><span class="pile">Umiem: ${FC.know}</span></div>
   <div class="bar"><i style="width:${FC.i/FC.deck.length*100}%"></i></div>
   <button class="flash" id="fl" aria-label="Odwróć fiszkę"><div class="inner">
     <div class="face"><div class="term">${t}</div><div class="hint">Powiedz definicję na głos, potem dotknij, żeby sprawdzić</div></div>
     <div class="face back"><div class="tag">${t}</div><div>${d}</div></div>
   </div></button>
   <div class="row"><button class="btn ghost" id="no">Jeszcze nie umiem</button><button class="btn" id="yes">Umiem</button></div></section>`;
  const fl=document.getElementById('fl');fl.onclick=()=>fl.classList.toggle('on');
  document.getElementById('yes').onclick=()=>{FC.know++;FC.i++;renderF()};
  document.getElementById('no').onclick=()=>{FC.again.push(FC.deck[FC.i]);FC.i++;renderF()};
}
const tq=document.getElementById('tabQuiz'),tf=document.getElementById('tabFlash');
tq.onclick=()=>{tq.setAttribute('aria-selected','true');tf.setAttribute('aria-selected','false');startQuiz()};
tf.onclick=()=>{tf.setAttribute('aria-selected','true');tq.setAttribute('aria-selected','false');startFlash()};
startQuiz();
</script>
</body></html>
